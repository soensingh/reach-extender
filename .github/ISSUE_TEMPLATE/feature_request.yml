name: Feature request
description: Suggest a specific improvement to Reach Extender.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. For open-ended brainstorming, [Discussions → Ideas](https://github.com/soensingh/reach-extender/discussions/categories/ideas) is a great place too, and other people can upvote it there.

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation, such as a kind of demo, call or recording, where Reach Extender falls short today.
      placeholder: "When I record tutorials in OBS, I'd like..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
      description: How it might work, from your point of view.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Workarounds or alternatives you've tried (optional)

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows (upcoming)
        - Both
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Anything else? (optional)
      description: Sketches, screenshots or examples are welcome.

  - type: checkboxes
    id: checks
    attributes:
      label: Before you submit
      options:
        - label: I searched existing issues, Discussions and the pinned Roadmap for this idea.
          required: true
